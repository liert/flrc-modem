[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flrc-modem"
version = "0.2.0"
description = "模块化 FLRC 调制解调、实时收发与协议插件"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",  # Viterbi JIT（nogil）；Python 3.14 需 >=0.68。缺失时自动退回纯 NumPy 实现
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    "httpx>=0.24.0",
]

[project.scripts]
flrc = "flrc_modem.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flrc_modem.sdr.hackrf" = ["native/windows-x64/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
