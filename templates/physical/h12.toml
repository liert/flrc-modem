[template]
schema_version = 1
kind = "physical_config"
title = "H12 物理层参数预设"
description = "Semtech SX1280 物理层配置: 1.3 Mbps, CR=1/1 (无FEC冗余), BT=0 (关闭高斯滤波)"
protocol = "h12"

# H12 物理层参数预设
[demod]
bit_rate = 1300000.0
coding_rate = "1"
bt = 0.0
chunk_seconds = 0.1
# 低通滤波器截止频率 (SX1280 1.3M 带宽约 1.2 MHz DSB)
filter_cutoff = 750000.0
max_preamble_errors = 2

# SX1280 SetPacketParams: header_type=0，无 2B 变长硬件头。
# 固定长度由固件随帧类型切换，包含 97B 扩展续包；不检查应用魔数。
header_type = "fixed"
payload_lengths = [32, 42, 97, 127]

crc_bytes = 4
crc_initials = [0xFFFFFFFF, 0x00000000]
